{% extends 'base.html' %}

{% block title %}Editar - Internia{% endblock %}

{% block content %}
    <div class="max-width-center">
        <h1 class="center-text mb-14">Editar Utilador</h1>
        <form method="POST" action="{{ url_for('editar', user_id=user.id) }}">
            <div class="vstack">
                <div class="form-group">
                    <label>Nome</label>
                    <input type="text" id="nome" name="nomeForm" value="{{user.nome}}" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="emailForm" value="{{user.email}}" required />
                </div>
                <button class="btn" type="submit">Atualizar</button>
            </div>
        </form>
    </div>
{% endblock %}
