{% extends 'base.html' %}

{% block title %}Editar - Internia{% endblock %}

{% block content %}
    <div style="max-width:520px;margin:0 auto">
        <h1 style="text-align:center;margin-bottom:14px">Editar Utilizador</h1>
        <form method="POST" action="{{ url_for('editar', user_id=user.id) }}">
            <div style="display:flex;flex-direction:column;gap:12px">
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Nome</label>
                    <input type="text" id="nome" name="nomeForm" value="{{user.nome}}" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Email</label>
                    <input type="email" id="email" name="emailForm" value="{{user.email}}" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <button class="btn" type="submit">Atualizar</button>
            </div>
        </form>
    </div>
{% endblock %}
