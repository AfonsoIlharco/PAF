{% extends 'base.html' %}

{% block title %}Registar - Internia{% endblock %}

{% block content %}
    <div class="max-width-center">
        <h1 class="center-text mb-14">Registar Utilizador</h1>
        <form method="POST" action="{{ url_for('registar') }}">
            <div class="vstack">
                <div class="form-group">
                    <label>Nome / Nome da Empresa</label>
                    <input type="text" id="nome" name="nomeForm" placeholder="Nome" required />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="emailForm" placeholder="Email" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="password" name="passwordForm" placeholder="Password" required />
                </div>
                <div class="form-group">
                    <div class="mb-6 label-strong">Tipo de Conta</div>
                    <label class="mr-12"><input type="radio" name="roleForm" value="user" checked> Utilizador</label>
                    <label><input type="radio" name="roleForm" value="empresa"> Empresa</label>
                </div>
                <button class="btn" type="submit">Registar</button>
            </div>
        </form>

        <div class="center-text mt-18 muted">Já tem conta? <a href="/login">Iniciar Sessão</a></div>
    </div>
{% endblock %}
