{% extends 'base.html' %}

{% block title %}Registar - Internia{% endblock %}

{% block content %}
    <div style="max-width:520px;margin:0 auto">
        <h1 style="text-align:center;margin-bottom:18px">Registar Utilizador</h1>
        <form method="POST" action="{{ url_for('registar') }}">
            <div style="display:flex;flex-direction:column;gap:12px">
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Nome / Nome da Empresa</label>
                    <input type="text" id="nome" name="nomeForm" placeholder="Nome" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Email</label>
                    <input type="email" id="email" name="emailForm" placeholder="Email" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Password</label>
                    <input type="password" id="password" name="passwordForm" placeholder="Password" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <div style="margin-bottom:6px;color:#374151;font-weight:600">Tipo de Conta</div>
                    <label style="margin-right:12px"><input type="radio" name="roleForm" value="user" checked> Utilizador</label>
                    <label><input type="radio" name="roleForm" value="empresa"> Empresa</label>
                </div>
                <button class="btn" type="submit">Registar</button>
            </div>
        </form>

        <div style="text-align:center;margin-top:14px;color:#6b7280">Já tem conta? <a href="/login">Iniciar Sessão</a></div>
    </div>
{% endblock %}
