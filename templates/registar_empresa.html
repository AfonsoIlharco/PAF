{% extends 'base.html' %}

{% block title %}Registar Empresa - Internia{% endblock %}

{% block content %}
    <div style="max-width:600px;margin:0 auto">
        <h1 style="margin-bottom:14px">Registar Empresa</h1>
        <form method="POST" action="{{ url_for('registar_empresa', user_id=user.id) }}" enctype="multipart/form-data">
            <div style="display:flex;flex-direction:column;gap:12px">
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Nome da Empresa</label>
                    <input type="text" id="nome" name="nome" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Email</label>
                    <input type="email" id="email" name="email" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Morada</label>
                    <textarea id="endereco" name="morada" rows="3" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3"></textarea>
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Descrição</label>
                    <input type="text" id="descricao" name="descricao" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Logótipo</label>
                    <input type="file" id="logo" name="logo" accept="image/*">
                </div>
                <button class="btn" type="submit">Registar</button>
            </div>
        </form>
    </div>
{% endblock %}
