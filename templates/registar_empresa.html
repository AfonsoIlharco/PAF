{% extends 'base.html' %}

{% block title %}Registar Empresa - Internia{% endblock %}

{% block content %}
    <div class="max-width-center">
        <h1 class="mb-14">Registar Empresa</h1>
        <form method="POST" action="{{ url_for('registar_empresa', user_id=user.id) }}" enctype="multipart/form-data">
            <div class="vstack">
                <div class="form-group">
                    <label>Nome da Empresa</label>
                    <input type="text" id="nome" name="nome" required />
                </div>
                <div class="form-group">
                    <label>NIF</label>
                    <input type="text" id="nif" name="nif" required placeholder="Número de Identificação Fiscal" />
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" name="email" required />
                </div>
                <div class="form-group">
                    <label>Morada</label>
                    <textarea id="endereco" name="morada" rows="3" required></textarea>
                </div>
                <div class="form-group">
                    <label>Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required />
                </div>
                <div class="form-group">
                    <label>Descrição</label>
                    <input type="text" id="descricao" name="descricao" required />
                </div>
                <div class="form-group">
                    <label>Logótipo</label>
                    <input type="file" id="logo" name="logo" accept="image/*">
                </div>
                <button class="btn" type="submit">Registar</button>
            </div>
        </form>
    </div>
{% endblock %}
