{% extends 'base.html' %}

{% block title %}Home - Internia{% endblock %}

{% block content %}
    <div>
        <h1 class="mb-14">Internia</h1>

        {% if current_user %}
            <div class="card mb-18">
                <div class="lead">Bem-vindo, <strong>{{ current_user.nome }}</strong></div>
                <div class="hstack gap-8 mt-10">
                    <a class="btn" href="{{ url_for('dashboard') }}">Ver Anúncios</a>
                </div>
            </div>

            <div class="vstack gap-8">
                <a class="btn" href="{{ url_for('editar', user_id=current_user.id) }}">Editar Informação</a>
                <a class="btn" href="{{ url_for('logout') }}">Terminar Sessão</a>
                <a class="danger-link" href="{{ url_for('apagar', user_id=current_user.id) }}">Apagar Conta</a>
            </div>
        {% else %}
            <div class="vstack gap-10">
                <a class="btn" href="{{ url_for('registar') }}">Registar</a>
                <a class="btn" href="{{ url_for('login') }}">Iniciar Sessão</a>
            </div>
        {% endif %}
    </div>
{% endblock %}
