{% extends 'base.html' %}

{% block title %}Home - Internia{% endblock %}

{% block content %}
    <div>
        <h1 style="margin:0 0 14px 0">Internia</h1>

        {% if current_user %}
            <div style="margin-bottom:18px;padding:14px;border-radius:8px;border:1px solid #eef2ff;background:#fbfdff">
                <div style="font-size:16px;color:#374151">Bem-vindo, <strong>{{ current_user.nome }}</strong></div>
                <div style="margin-top:10px;display:flex;gap:8px">
                    <a class="btn" href="{{ url_for('dashboard') }}">Ver Anúncios</a>
                </div>
            </div>

            <div style="display:flex;flex-direction:column;gap:8px">
                <a class="btn" href="{{ url_for('editar', user_id=current_user.id) }}">Editar Informação</a>
                <a class="btn" href="{{ url_for('logout') }}">Terminar Sessão</a>
                <a class="btn" href="{{ url_for('apagar', user_id=current_user.id) }}" style="background:#d32f2f">Apagar Conta</a>
            </div>
        {% else %}
            <div style="display:flex;flex-direction:column;gap:10px">
                <a class="btn" href="{{ url_for('registar') }}">Registar</a>
                <a class="btn" href="{{ url_for('login') }}">Iniciar Sessão</a>
            </div>
        {% endif %}
    </div>
{% endblock %}
