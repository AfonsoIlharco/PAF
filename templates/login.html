{% extends 'base.html' %}

{% block title %}Entrar - Internia{% endblock %}

{% block content %}
    <div style="max-width:520px;margin:0 auto">
        <h1 style="text-align:center;margin-bottom:20px">Login</h1>
        <form method="POST">
            <div style="display:flex;flex-direction:column;gap:12px">
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Email</label>
                    <input type="email" name="emailForm" placeholder="Email" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                <div>
                    <label style="display:block;margin-bottom:6px;color:#374151;font-weight:600">Password</label>
                    <input type="password" name="passwordForm" placeholder="Password" required style="width:100%;padding:10px;border-radius:8px;border:1px solid #e6edf3" />
                </div>
                {% if error %}
                    <div style="color:#b91c1c;padding:10px;border-radius:6px;background:#fff1f2">{{ error }}</div>
                {% endif %}
                <button class="btn" type="submit">Entrar</button>
            </div>
        </form>

        <div style="text-align:center;margin-top:14px;color:#6b7280">Não tem conta? <a href="{{ url_for('registar') }}">Registar</a></div>
    </div>
{% endblock %}
