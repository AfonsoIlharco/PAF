{% extends 'base.html' %}

{% block title %}Entrar - Internia{% endblock %}

{% block content %}
    <div class="max-width-center">
        <h1 class="center-text mb-14">Login</h1>
        <form method="POST">
            <div class="vstack">
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" name="emailForm" placeholder="Email" required />
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="passwordForm" placeholder="Password" required />
                </div>
                {% if error %}
                    <div class="error-message">{{ error }}</div>
                {% endif %}
                <button class="btn" type="submit">Entrar</button>
            </div>
        </form>

        <div class="center-text mt-18 muted">Não tem conta? <a href="{{ url_for('registar') }}">Registar</a></div>
    </div>
{% endblock %}
